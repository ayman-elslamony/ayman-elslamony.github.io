name: portfolio
description: Portfolio developed in flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flex_color_scheme: ^8.4.0
  google_fonts: ^8.1.0
  font_awesome_flutter: ^11.0.0
  riverpod_annotation: ^4.0.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  collection: ^1.18.0
  url_launcher: ^6.2.1
  web: ^1.1.1
#  firebase_core: ^2.17.0
#  firebase_core_desktop: ^1.0.2
  url_strategy: ^0.3.0
  intl: 0.20.2
  easy_localization: ^3.0.3
  easy_logger: ^0.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  readmore: ^3.0.0
  device_preview: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.6
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  flutter_native_splash: ^2.3.4
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_light.png"
  color_dark: "#303944"
  image_dark: "assets/images/splash_dark.png"
#flutter_native_splash:
#  color: "#FFFFFF"
#  image: "assets/images/laptop_load.gif"
#  icon_background_color: "#303944"
#  color_dark: "#303944"
#  image_dark: "assets/images/laptop_load.gif"
#  icon_background_color_dark: "#FFFFFF"
flutter_launcher_icons:
  android: false
  ios: false
#  android: "ic_launcher"
#  ios: true
#  remove_alpha_ios: true
#  image_path: "assets/images/laptop_code.svg"
#
#  min_sdk_android: 21 # android min sdk min:16, default 21
  web: false
#    generate: true
#    image_path: "assets/images/laptop_code.svg"
  windows:
    generate: true
    image_path: "assets/images/laptop_code.svg"
    icon_size: 256 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/laptop_code.svg"