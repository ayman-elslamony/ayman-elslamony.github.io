<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7CSVPF51ER"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // page_location is passed explicitly so GA4 keeps a CV link's utm_* tags; the address
    // bar is then cleaned, so a reader never sees which company's copy they opened.
    gtag('config', 'G-7CSVPF51ER', {page_location: location.href});
    if (/[?&]utm_/.test(location.search)) {
      // The app greets a company by its campaign tag, and cannot read it once it is gone.
      try { sessionStorage.setItem('utm_campaign', new URLSearchParams(location.search).get('utm_campaign') || ''); } catch (e) {}
      history.replaceState(null, '', location.pathname + location.hash);
    }
  </script>

  <!--    <base href="$FLUTTER_BASE_HREF">-->
<!--  <base href="/Family-Store/">-->
  <base href="$FLUTTER_BASE_HREF">

  <!-- Google Search Console ownership proof. Google fetches this page and looks for the tag,
       so it has to stay in the published HTML - do not remove it after verification. -->
  <meta name="google-site-verification" content="31h5WdL74oJmVcENNFtGQNM0EbmRDzaozwPp3a7CgvU" />

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Senior Flutter Developer with 5+ years of experience building Android and iOS apps, and the shared architecture and release pipelines behind them.">

  <!-- Open Graph / Twitter Card: what a pasted link renders as in LinkedIn, WhatsApp and email.
       Link unfurlers read this raw HTML and never run the Flutter app, so these tags are the
       only thing they ever see. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ayman-elslamony.github.io/">
  <meta property="og:title" content="Portfolio — Senior Flutter Developer">
  <meta property="og:description" content="See the work: 19 projects with screenshots, a case study of the shared architecture, and a manager&#39;s recommendation.">
  <meta property="og:image" content="https://ayman-elslamony.github.io/og-image.png?v=2026-10-05">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Ayman Elslamony">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Portfolio — Senior Flutter Developer">
  <meta name="twitter:description" content="See the work: 19 projects with screenshots, a case study of the shared architecture, and a manager&#39;s recommendation.">
  <meta name="twitter:image" content="https://ayman-elslamony.github.io/og-image.png?v=2026-10-05">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ayman Elslamony">
  <!-- The browser bar's colour follows the visitor's scheme: the page backgrounds in
       web/styles.css (--light-background, --dark-background). manifest.json can hold only one
       theme_color, the light one; these tags win over it where a browser reads them. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <!-- Icons: all written by tools/make_icons.py from one drawing of the mark. The SVG is
       the tab icon in current browsers and follows dark mode; the .ico is the fallback. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Ayman Elslamony — Senior Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "{{flutter_service_worker_version}}";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter_bootstrap.js" defer></script>

  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
<!-- Pre-boot loader. It is the site's own icon (the same laptop-and-code mark as
     web/icons/, whose geometry tools/make_icons.py repeats - change one, change the other)
     drawn INLINE as SVG rather than loaded from an image: inline, it takes its colour from
     CSS, so it follows the light/dark scheme like everything else. -->
<div class="loader" role="status" aria-label="Loading">
  <svg class="loader-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <rect class="loader-mark" x="14" y="18" width="36" height="24" rx="4" stroke-width="3.5"/>
    <path class="loader-mark" d="M28 27l-5 5 5 5M36 27l5 5-5 5" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path class="loader-mark" d="M8 48h48" stroke-width="5" stroke-linecap="round"/>
  </svg>
</div>

<script>
  window.addEventListener('load', function(ev) {
    _flutter.loader.load({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
        serviceWorkerUrl: 'flutter_service_worker.js'
      }
    });
  });
</script>
</body>
</html>
