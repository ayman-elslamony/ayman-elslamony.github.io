<!DOCTYPE html>

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7CSVPF51ER"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // page_location is passed explicitly so GA4 keeps a CV link's utm_* tags; the address
    // bar is then cleaned, so a reader never sees which company's copy they opened.
    gtag('config', 'G-7CSVPF51ER', {page_location: location.href});
    if (/[?&]utm_/.test(location.search)) {
      // The app greets a company by its campaign tag, and cannot read it once it is gone.
      try { sessionStorage.setItem('utm_campaign', new URLSearchParams(location.search).get('utm_campaign') || ''); } catch (e) {}
      history.replaceState(null, '', location.pathname + location.hash);
    }
  </script>

  <!-- Google Search Console ownership proof. Google fetches this page and looks for the tag,

<!-- Pre-boot loader. It is the site's own icon (the same laptop-and-code mark as
     web/icons/) drawn INLINE as SVG rather than loaded from icons/icon-192.png: that PNG
     is a solid black glyph, which disappears on the dark background. Inline, it takes its
     colour from CSS, so it follows the light/dark scheme like everything else. -->
<div class="loader" role="status" aria-label="Loading">
  <svg class="loader-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <rect class="loader-mark" x="14" y="18" width="36" height="24" rx="4" stroke-width="3.5"/>
    <path class="loader-mark" d="M28 27l-5 5 5 5M36 27l5 5-5 5" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path class="loader-mark" d="M8 48h48" stroke-width="5" stroke-linecap="round"/>
  </svg>
</div>

<script>
  window.addEventListener('load', function(ev) {
    _flutter.loader.load({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
        serviceWorkerUrl: 'flutter_service_worker.js'
      }
    });
  });
</script>
